<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LernStar Setup</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f5f3ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 20px; padding: 40px; max-width: 400px; width: 90%; box-shadow: 0 8px 32px rgba(124,58,237,.15); text-align: center; }
  h1 { color: #7c3aed; margin-bottom: 8px; }
  p { color: #6b7280; margin-bottom: 24px; }
  input { width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 12px; border: 2px solid #e5e7eb; font-size: 1rem; margin-bottom: 12px; font-family: inherit; }
  input:focus { outline: none; border-color: #7c3aed; }
  button { width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:hover { opacity: .9; }
  .success { display: none; color: #059669; font-weight: 700; margin-top: 16px; font-size: 1.1rem; }
</style>
</head>
<body>
<div class="card">
  <h1>⭐ LernStar Setup</h1>
  <p>Groq API-Key eingeben, damit Herr Lala funktioniert.</p>
  <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off">
  <button onclick="saveKey()">💾 Key speichern & starten</button>
  <div class="success" id="ok">✅ Gespeichert! Weiterleitung…</div>
</div>
<script>
  // Prüfen ob Key schon gesetzt
  if (localStorage.getItem('ls_groq_key')) {
    window.location.href = 'index.html';
  }
  function saveKey() {
    const k = document.getElementById('keyInput').value.trim();
    if (!k || !k.startsWith('gsk_')) { alert('Bitte einen gültigen Groq-Key eingeben (beginnt mit gsk_)'); return; }
    localStorage.setItem('ls_groq_key', k);
    document.getElementById('ok').style.display = 'block';
    setTimeout(() => window.location.href = 'index.html', 1500);
  }
</script>
</body>
</html>
