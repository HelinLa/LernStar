<!-- GEMEINSAMER STILBAUKASTEN fuer die Einstiegsbilder.
     Wird von jedem Szenen-SVG woertlich in <defs> uebernommen, damit alle Bilder
     dieselben Materialien haben. Material A (Verlaeufe, Glanz) + Ordnung C (klare
     Silhouetten, ruhige Flaechen). -->

<!-- ===== Karte ===== -->
<linearGradient id="karte" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFF7E8"/><stop offset="1" stop-color="#F9E8CE"/>
</linearGradient>
<clipPath id="clipKarte"><rect x="0" y="0" width="900" height="540" rx="84"/></clipPath>

<!-- ===== Holz: Grundverlauf + echte Maserung ueber feTurbulence ===== -->
<linearGradient id="holz" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#A9762F"/><stop offset="0.18" stop-color="#C08F45"/>
  <stop offset="0.55" stop-color="#CE9C56"/><stop offset="0.86" stop-color="#B27F3C"/>
  <stop offset="1" stop-color="#96682A"/>
</linearGradient>
<linearGradient id="holzHell" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#C79A5C"/><stop offset="0.5" stop-color="#D8AE71"/>
  <stop offset="1" stop-color="#B98D50"/>
</linearGradient>
<filter id="maser" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.010 0.42" numOctaves="4" seed="11" result="n"/>
  <feColorMatrix in="n" type="matrix" result="m"
    values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.42 0"/>
  <feComposite in="m" in2="SourceGraphic" operator="atop"/>
</filter>
<filter id="rauh" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
  <feColorMatrix in="n" type="matrix" result="m"
    values="0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0.35 0"/>
  <feComposite in="m" in2="SourceGraphic" operator="atop"/>
</filter>

<!-- ===== Stahl: Hauptverlauf, warmer Reflex von unten, harter Glanzpunkt ===== -->
<radialGradient id="stahl" cx="0.5" cy="0.5" r="0.68" fx="0.32" fy="0.26">
  <stop offset="0" stop-color="#F7FAFD"/><stop offset="0.16" stop-color="#D4DEE9"/>
  <stop offset="0.42" stop-color="#9BA9BB"/><stop offset="0.70" stop-color="#65728A"/>
  <stop offset="0.89" stop-color="#3F4960"/><stop offset="1" stop-color="#2C3547"/>
</radialGradient>
<radialGradient id="stahlWarm" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFEBC2" stop-opacity="0.92"/>
  <stop offset="0.55" stop-color="#EFCB90" stop-opacity="0.42"/>
  <stop offset="1" stop-color="#DFB578" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glanz" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
  <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.38"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="blech" x1="0" y1="0" x2="0.35" y2="1">
  <stop offset="0" stop-color="#D9E1EA"/><stop offset="0.4" stop-color="#A6B2C2"/>
  <stop offset="0.75" stop-color="#7C8899"/><stop offset="1" stop-color="#9DA9B8"/>
</linearGradient>
<linearGradient id="magnetKlotz" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7A8496"/><stop offset="0.26" stop-color="#4D5768"/>
  <stop offset="0.62" stop-color="#323B4D"/><stop offset="0.88" stop-color="#222939"/>
  <stop offset="1" stop-color="#3E4759"/>
</linearGradient>

<!-- ===== Gras ===== -->
<linearGradient id="gras" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8FB362"/><stop offset="0.5" stop-color="#6E9449"/>
  <stop offset="1" stop-color="#4F7134"/>
</linearGradient>
<linearGradient id="grasDunkel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6B8F46"/><stop offset="1" stop-color="#3E5B29"/>
</linearGradient>

<!-- ===== Schatten ===== -->
<filter id="kontakt" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="1" dy="3" stdDeviation="2.2" flood-color="#3A2B14" flood-opacity="0.55"/>
</filter>
<filter id="weich" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#3A2B14" flood-opacity="0.32"/>
</filter>
<filter id="tiefe" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="9"/>
</filter>

<!-- ===== Karte Nacht ===== -->
<linearGradient id="karteNacht" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#1B2340"/><stop offset="0.55" stop-color="#141B33"/>
  <stop offset="1" stop-color="#0E1428"/>
</linearGradient>

<!-- ===== Vignetten (liegen immer ganz oben auf der Szene) ===== -->
<radialGradient id="vigTag" cx="0.5" cy="0.48" r="0.78">
  <stop offset="0.40" stop-color="#2A1B06" stop-opacity="0"/>
  <stop offset="1" stop-color="#2A1B06" stop-opacity="0.44"/>
</radialGradient>
<radialGradient id="vigNacht" cx="0.5" cy="0.48" r="0.76">
  <stop offset="0.38" stop-color="#050912" stop-opacity="0"/>
  <stop offset="1" stop-color="#050912" stop-opacity="0.52"/>
</radialGradient>

<!-- ===== weitere Grundmaterialien ===== -->
<linearGradient id="kunststoff" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#6E7686"/><stop offset="0.34" stop-color="#454D5D"/>
  <stop offset="0.78" stop-color="#2B3240"/><stop offset="1" stop-color="#3B4353"/>
</linearGradient>
<linearGradient id="pappe" x1="0" y1="0" x2="0.2" y2="1">
  <stop offset="0" stop-color="#C29764"/><stop offset="0.5" stop-color="#A87F4C"/>
  <stop offset="1" stop-color="#8A6437"/>
</linearGradient>
<linearGradient id="papier" x1="0" y1="0" x2="0.15" y2="1">
  <stop offset="0" stop-color="#FDF7E9"/><stop offset="0.6" stop-color="#F7EEDB"/>
  <stop offset="1" stop-color="#EADFC6"/>
</linearGradient>
<linearGradient id="glasK" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
  <stop offset="0.18" stop-color="#DCE9EC" stop-opacity="0.18"/>
  <stop offset="0.72" stop-color="#B7CACE" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
</linearGradient>
<linearGradient id="wasser" x1="0" y1="0" x2="0.25" y2="1">
  <stop offset="0" stop-color="#CFE6E6" stop-opacity="0.72"/>
  <stop offset="1" stop-color="#8FB6BC" stop-opacity="0.82"/>
</linearGradient>
<radialGradient id="flamme" cx="0.5" cy="0.62" r="0.5">
  <stop offset="0" stop-color="#FFF6D2"/><stop offset="0.42" stop-color="#FFCC55"/>
  <stop offset="0.78" stop-color="#F09022" stop-opacity="0.75"/>
  <stop offset="1" stop-color="#C9631A" stop-opacity="0"/>
</radialGradient>
<radialGradient id="warmSchein" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFE6A8" stop-opacity="0.85"/>
  <stop offset="0.35" stop-color="#FFD07A" stop-opacity="0.3"/>
  <stop offset="1" stop-color="#FFC864" stop-opacity="0"/>
</radialGradient>
<filter id="schein" x="-120%" y="-120%" width="340%" height="340%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<filter id="scheinKlein" x="-120%" y="-120%" width="340%" height="340%">
  <feGaussianBlur stdDeviation="6"/>
</filter>

<!-- ===== Tageslicht wegnehmen =====
     Bauteile sind fuer Tageslicht gebaut. In Nacht- und Daemmerungsszenen werden sie
     ueber diese Filter entsaettigt und abgedunkelt, statt sie ein zweites Mal zu zeichnen. -->
<filter id="nachtTon" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feColorMatrix type="saturate" values="0.22" result="e"/>
  <feColorMatrix in="e" type="matrix" values="
    0.30 0 0 0 0.015
    0 0.32 0 0 0.028
    0 0 0.40 0 0.070
    0 0 0 1 0"/>
</filter>
<filter id="daemmerTon" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feColorMatrix type="saturate" values="0.18" result="e"/>
  <feColorMatrix in="e" type="matrix" values="
    0.52 0 0 0 0.04
    0 0.54 0 0 0.05
    0 0 0.62 0 0.09
    0 0 0 1 0"/>
</filter>
