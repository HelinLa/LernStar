<!-- nacht -->
<defs>
  <linearGradient id="l1erde" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A2A22"/><stop offset="0.5" stop-color="#1E2018"/>
    <stop offset="1" stop-color="#141610"/>
  </linearGradient>
  <linearGradient id="l1horizont" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0E1428" stop-opacity="0"/>
    <stop offset="1" stop-color="#080C18" stop-opacity="0.85"/>
  </linearGradient>
  <radialGradient id="l1mondlicht" cx="0.76" cy="0.22" r="0.62">
    <stop offset="0" stop-color="#AFC4E6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#AFC4E6" stop-opacity="0"/>
  </radialGradient>
</defs>
  <use href="#t_sterne" x="0" y="0"/>
  <use href="#t_mond" transform="translate(688,126) scale(0.92)"/>
  <rect x="0" y="0" width="900" height="540" fill="url(#l1mondlicht)"/>

  <!-- Waldrand hinten -->
  <g filter="url(#nachtTon)" opacity="0.9">
    <use href="#t_baum_fern" transform="translate(430,392) scale(1.05)"/>
    <use href="#t_baum_fern" transform="translate(556,384) scale(0.82)"/>
