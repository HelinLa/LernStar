  <rect x="0" y="230" width="900" height="200" fill="url(#l1horizont)"/>
  <rect x="0" y="120" width="900" height="300" fill="#0E1428" opacity="0.34"/>

  <!-- Boden -->
  <rect x="0" y="386" width="900" height="154" fill="url(#l1erde)"/>
  <path d="M0,392 Q220,378 452,392 Q690,404 900,388 L900,410 L0,410 Z" fill="#0C0E0A" opacity="0.55"/>
  <g filter="url(#nachtTon)">
    <use href="#t_grasbuschel" transform="translate(96,432) scale(0.9)"/>
    <use href="#t_grasbuschel" transform="translate(320,452) scale(1.1)"/>
    <use href="#t_grasbuschel" transform="translate(618,442) scale(0.8)"/>
