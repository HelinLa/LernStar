<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<defs>
<!-- ===== Karte ===== -->
<linearGradient id="karte" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFF7E8"/><stop offset="1" stop-color="#F9E8CE"/>
</linearGradient>
<clipPath id="clipKarte"><rect x="0" y="0" width="900" height="540" rx="84"/></clipPath>

<!-- ===== Holz: Grundverlauf + echte Maserung ueber feTurbulence ===== -->
<linearGradient id="holz" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#A9762F"/><stop offset="0.18" stop-color="#C08F45"/>
  <stop offset="0.55" stop-color="#CE9C56"/><stop offset="0.86" stop-color="#B27F3C"/>
  <stop offset="1" stop-color="#96682A"/>
</linearGradient>
<linearGradient id="holzHell" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#C79A5C"/><stop offset="0.5" stop-color="#D8AE71"/>
  <stop offset="1" stop-color="#B98D50"/>
</linearGradient>
<filter id="maser" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.010 0.42" numOctaves="4" seed="11" result="n"/>
  <feColorMatrix in="n" type="matrix" result="m"
    values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.42 0"/>
  <feComposite in="m" in2="SourceGraphic" operator="atop"/>
</filter>
<filter id="rauh" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
  <feColorMatrix in="n" type="matrix" result="m"
    values="0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0.35 0"/>
  <feComposite in="m" in2="SourceGraphic" operator="atop"/>
</filter>

<!-- ===== Stahl: Hauptverlauf, warmer Reflex von unten, harter Glanzpunkt ===== -->
<radialGradient id="stahl" cx="0.5" cy="0.5" r="0.68" fx="0.32" fy="0.26">
  <stop offset="0" stop-color="#F7FAFD"/><stop offset="0.16" stop-color="#D4DEE9"/>
  <stop offset="0.42" stop-color="#9BA9BB"/><stop offset="0.70" stop-color="#65728A"/>
  <stop offset="0.89" stop-color="#3F4960"/><stop offset="1" stop-color="#2C3547"/>
</radialGradient>
<radialGradient id="stahlWarm" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFEBC2" stop-opacity="0.92"/>
  <stop offset="0.55" stop-color="#EFCB90" stop-opacity="0.42"/>
  <stop offset="1" stop-color="#DFB578" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glanz" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
  <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.38"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="blech" x1="0" y1="0" x2="0.35" y2="1">
  <stop offset="0" stop-color="#D9E1EA"/><stop offset="0.4" stop-color="#A6B2C2"/>
  <stop offset="0.75" stop-color="#7C8899"/><stop offset="1" stop-color="#9DA9B8"/>
</linearGradient>
<linearGradient id="magnetKlotz" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7A8496"/><stop offset="0.26" stop-color="#4D5768"/>
  <stop offset="0.62" stop-color="#323B4D"/><stop offset="0.88" stop-color="#222939"/>
  <stop offset="1" stop-color="#3E4759"/>
</linearGradient>

<!-- ===== Gras ===== -->
<linearGradient id="gras" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8FB362"/><stop offset="0.5" stop-color="#6E9449"/>
  <stop offset="1" stop-color="#4F7134"/>
</linearGradient>
<linearGradient id="grasDunkel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6B8F46"/><stop offset="1" stop-color="#3E5B29"/>
</linearGradient>

<!-- ===== Schatten ===== -->
<filter id="kontakt" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="1" dy="3" stdDeviation="2.2" flood-color="#3A2B14" flood-opacity="0.55"/>
</filter>
<filter id="weich" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#3A2B14" flood-opacity="0.32"/>
</filter>
<filter id="tiefe" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="9"/>
</filter>

<!-- ================= eigene defs (Praefix m2) ================= -->
<linearGradient id="m2Wand" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4A3116"/><stop offset="0.55" stop-color="#6B4820"/>
  <stop offset="1" stop-color="#3B2611"/>
</linearGradient>
<linearGradient id="m2WandLicht" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#C79A5C" stop-opacity="0"/>
  <stop offset="1" stop-color="#E8C68C" stop-opacity="0.30"/>
</linearGradient>
<linearGradient id="m2Sheen" x1="0" y1="0" x2="0.6" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.42"/>
  <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.10"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="m2Kante" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F4F8FC"/><stop offset="0.45" stop-color="#C3CDD9"/>
  <stop offset="1" stop-color="#75808F"/>
</linearGradient>
<linearGradient id="m2Eisen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E7ECF2"/><stop offset="0.34" stop-color="#B0B9C4"/>
  <stop offset="0.72" stop-color="#6E7783"/><stop offset="1" stop-color="#4A525E"/>
</linearGradient>
<linearGradient id="m2Kupfer" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F4C494"/><stop offset="0.3" stop-color="#D08A47"/>
  <stop offset="0.7" stop-color="#A25A28"/><stop offset="1" stop-color="#7A3F1B"/>
</linearGradient>
<linearGradient id="m2Dose" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8D98A8"/><stop offset="0.16" stop-color="#DCE4EC"/>
  <stop offset="0.34" stop-color="#F3F7FA"/><stop offset="0.56" stop-color="#A9B4C2"/>
  <stop offset="0.82" stop-color="#68727F"/><stop offset="1" stop-color="#98A2AF"/>
</linearGradient>
<radialGradient id="m2DoseEnd" cx="0.42" cy="0.32" r="0.78">
  <stop offset="0" stop-color="#E6ECF3"/><stop offset="0.5" stop-color="#A3AEBC"/>
  <stop offset="1" stop-color="#5C6572"/>
</radialGradient>
<linearGradient id="m2Klammer" x1="0" y1="0" x2="0.2" y2="1">
  <stop offset="0" stop-color="#EDF2F7"/><stop offset="0.45" stop-color="#B4BDC9"/>
  <stop offset="1" stop-color="#767F8C"/>
</linearGradient>
<linearGradient id="m2MagnetTop" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#9AA4B4"/><stop offset="0.45" stop-color="#68738A"/>
  <stop offset="1" stop-color="#464F63"/>
</linearGradient>
<radialGradient id="m2Vignette" cx="0.5" cy="0.46" r="0.72">
  <stop offset="0.45" stop-color="#2B1C08" stop-opacity="0"/>
  <stop offset="1" stop-color="#2B1C08" stop-opacity="0.40"/>
</radialGradient>
<linearGradient id="m2WandSchatten" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2A1B08" stop-opacity="0.55"/>
  <stop offset="1" stop-color="#2A1B08" stop-opacity="0"/>
</linearGradient>
<clipPath id="m2ClipA"><path d="M-98,-58 L94,-52 L92,54 L-96,60 Z"/></clipPath>
<clipPath id="m2ClipB"><path d="M-88,-52 L50,-56 L90,-6 L86,52 L-84,46 Z"/></clipPath>
<clipPath id="m2ClipC"><path d="M-106,-40 L104,-50 L100,18 L40,24 L36,48 L-102,44 Z"/></clipPath>
</defs>

<g clip-path="url(#clipKarte)">
  <rect width="900" height="540" fill="url(#karte)"/>

  <!-- ===== Hintergrund: Rueckwand des Schuppens, unscharf ===== -->
  <g filter="url(#tiefe)">
    <rect x="-20" y="-20" width="940" height="205" fill="url(#m2Wand)"/>
    <g opacity="0.55">
      <rect x="40" y="-20" width="7" height="205" fill="#2C1B09"/>
      <rect x="150" y="-20" width="8" height="205" fill="#2C1B09"/>
      <rect x="272" y="-20" width="7" height="205" fill="#2C1B09"/>
      <rect x="398" y="-20" width="9" height="205" fill="#2C1B09"/>
      <rect x="520" y="-20" width="7" height="205" fill="#2C1B09"/>
      <rect x="640" y="-20" width="8" height="205" fill="#2C1B09"/>
      <rect x="762" y="-20" width="7" height="205" fill="#2C1B09"/>
      <rect x="864" y="-20" width="8" height="205" fill="#2C1B09"/>
    </g>
    <rect x="-20" y="96" width="940" height="90" fill="url(#m2WandLicht)"/>
    <g fill="url(#grasDunkel)" opacity="0.85">
      <path d="M20,186 q26,-46 52,-4 q22,-34 44,6 Z"/>
      <path d="M792,186 q30,-52 56,-6 q20,-30 40,4 Z"/>
    </g>
  </g>

  <!-- ===== Bretterboden ===== -->
  <g filter="url(#maser)">
    <rect x="0" y="168" width="900" height="372" fill="url(#holz)"/>
    <rect x="0" y="203" width="900" height="36" fill="url(#holzHell)" opacity="0.55"/>
    <rect x="0" y="278" width="900" height="43" fill="url(#holzHell)" opacity="0.40"/>
    <rect x="0" y="369" width="900" height="53" fill="url(#holzHell)" opacity="0.50"/>
    <rect x="0" y="480" width="900" height="60" fill="url(#holzHell)" opacity="0.30"/>
  </g>
  <g stroke-linecap="round">
    <g stroke="#5C3D18" stroke-width="3.4" opacity="0.85">
      <path d="M0,203 H900"/><path d="M0,239 H900"/><path d="M0,278 H900"/>
      <path d="M0,321 H900"/><path d="M0,369 H900"/><path d="M0,422 H900"/>
      <path d="M0,480 H900"/>
      <path d="M520,203 V239"/><path d="M330,278 V321"/><path d="M688,369 V422"/>
    </g>
    <g stroke="#E4BE84" stroke-width="1.5" opacity="0.45">
      <path d="M0,206 H900"/><path d="M0,242 H900"/><path d="M0,281 H900"/>
      <path d="M0,324 H900"/><path d="M0,372 H900"/><path d="M0,425 H900"/>
      <path d="M0,483 H900"/>
    </g>
  </g>
  <rect x="0" y="168" width="900" height="58" fill="url(#m2WandSchatten)"/>

  <!-- ================= Blech A ================= -->
  <g transform="translate(214,314) rotate(-9)">
    <g filter="url(#kontakt)">
      <path d="M-98,-58 L94,-52 L92,54 L-96,60 Z" fill="url(#blech)"/>
    </g>
    <g clip-path="url(#m2ClipA)">
      <path d="M-120,-20 L120,-58 L120,4 L-120,44 Z" fill="url(#m2Sheen)"/>
      <ellipse cx="-6" cy="46" rx="74" ry="20" fill="url(#stahlWarm)" opacity="0.55"/>
      <ellipse cx="-46" cy="-32" rx="42" ry="17" fill="url(#glanz)"/>
      <path d="M-120,10 L120,-24 L120,-14 L-120,20 Z" fill="#5A6474" opacity="0.22"/>
    </g>
    <path d="M-98,-58 L94,-52" stroke="#F2F7FB" stroke-width="2.6" fill="none" opacity="0.9"/>
    <path d="M-96,60 L92,54" stroke="#3B4353" stroke-width="2.2" fill="none" opacity="0.55"/>
    <path d="M94,-52 L118,-72 L116,36 L92,54 Z" fill="url(#m2Kante)"/>
    <path d="M94,-52 L118,-72" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.85"/>
  </g>

  <!-- ================= Blech B ================= -->
  <g transform="translate(396,272) rotate(9)">
    <g filter="url(#kontakt)">
      <path d="M-88,-52 L50,-56 L90,-6 L86,52 L-84,46 Z" fill="url(#blech)"/>
    </g>
    <g clip-path="url(#m2ClipB)">
      <path d="M-110,-14 L110,-56 L110,6 L-110,48 Z" fill="url(#m2Sheen)"/>
      <ellipse cx="6" cy="42" rx="66" ry="18" fill="url(#stahlWarm)" opacity="0.55"/>
      <ellipse cx="-40" cy="-30" rx="38" ry="15" fill="url(#glanz)"/>
      <path d="M-110,16 L110,-20 L110,-10 L-110,26 Z" fill="#5A6474" opacity="0.20"/>
    </g>
    <path d="M-88,-52 L50,-56 L90,-6" stroke="#F2F7FB" stroke-width="2.6" fill="none" opacity="0.9"/>
    <path d="M-84,46 L86,52" stroke="#3B4353" stroke-width="2.2" fill="none" opacity="0.55"/>
    <path d="M86,52 L100,44 L104,-2 L90,-6 Z" fill="url(#m2Kante)"/>
  </g>

  <!-- ================= Blech C ================= -->
  <g transform="translate(604,342) rotate(-17)">
    <g filter="url(#kontakt)">
      <path d="M-106,-40 L104,-50 L100,18 L40,24 L36,48 L-102,44 Z" fill="url(#blech)"/>
    </g>
    <g clip-path="url(#m2ClipC)">
      <path d="M-130,-6 L130,-56 L130,4 L-130,54 Z" fill="url(#m2Sheen)"/>
      <ellipse cx="-24" cy="38" rx="70" ry="16" fill="url(#stahlWarm)" opacity="0.55"/>
      <ellipse cx="-52" cy="-22" rx="44" ry="14" fill="url(#glanz)"/>
      <path d="M-130,22 L130,-24 L130,-14 L-130,32 Z" fill="#5A6474" opacity="0.20"/>
    </g>
    <path d="M-106,-40 L104,-50" stroke="#F2F7FB" stroke-width="2.6" fill="none" opacity="0.9"/>
    <path d="M-102,44 L36,48 L40,24 L100,18" stroke="#3B4353" stroke-width="2.2" fill="none" opacity="0.5"/>
    <path d="M-106,-40 L-118,-26 L-114,50 L-102,44 Z" fill="url(#m2Kante)"/>
  </g>

  <!-- ================= Bueroklammer ================= -->
  <g transform="translate(146,224) rotate(-27) scale(1.3)">
    <g filter="url(#kontakt)">
      <path d="M-30,-14 C-44,-14 -44,14 -30,14 L26,14 C38,14 38,-10 26,-10 L-14,-10 C-24,-10 -24,8 -14,8 L20,8"
            fill="none" stroke="url(#m2Klammer)" stroke-width="6" stroke-linecap="round"/>
    </g>
    <path d="M-30,-11 C-40,-11 -40,3 -30,3 M-26,-11 L26,-7" fill="none" stroke="#FFFFFF"
          stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- ================= Holzklotz ================= -->
  <g transform="translate(764,222) rotate(-4)">
    <ellipse cx="4" cy="50" rx="72" ry="20" fill="#3A2B14" opacity="0.34" filter="url(#tiefe)"/>
    <g filter="url(#maser)">
      <path d="M-58,-10 L30,-22 L64,-44 L-24,-32 Z" fill="url(#holzHell)"/>
      <path d="M-58,-10 L30,-22 L30,44 L-58,52 Z" fill="url(#holz)"/>
      <path d="M30,-22 L64,-44 L64,22 L30,44 Z" fill="url(#holz)"/>
    </g>
    <path d="M30,-22 L64,-44 L64,22 L30,44 Z" fill="#3A2610" opacity="0.34"/>
    <path d="M-58,-10 L30,-22 L64,-44 L-24,-32 Z" fill="url(#glanz)" opacity="0.22"/>
    <path d="M-58,-10 L30,-22" stroke="#F0D3A2" stroke-width="2.2" fill="none" opacity="0.55"/>
    <path d="M-58,52 L30,44" stroke="#4A3115" stroke-width="2.4" fill="none" opacity="0.5"/>
    <ellipse cx="-16" cy="44" rx="34" ry="10" fill="url(#stahlWarm)" opacity="0.28"/>
  </g>

  <!-- ================= Blockmagnet (beruehrt nichts) ================= -->
  <g transform="translate(400,390) rotate(-6) scale(1.14)">
    <g filter="url(#weich)">
      <path d="M-52,0 L-36,-17 L64,-17 L64,3 L48,20 L-52,20 Z" fill="url(#magnetKlotz)"/>
    </g>
    <path d="M-52,0 L-36,-17 L64,-17 L48,0 Z" fill="url(#m2MagnetTop)"/>
    <path d="M48,0 L64,-17 L64,3 L48,20 Z" fill="#1D2432"/>
    <path d="M-52,0 L48,0 L48,20 L-52,20 Z" fill="url(#magnetKlotz)"/>
    <path d="M-52,0 L48,0" stroke="#C3CDDD" stroke-width="2" fill="none" opacity="0.75"/>
    <path d="M-36,-17 L64,-17" stroke="#AEB9CB" stroke-width="1.6" fill="none" opacity="0.5"/>
    <ellipse cx="-4" cy="-8" rx="38" ry="6" fill="url(#glanz)" opacity="0.5"/>
    <ellipse cx="0" cy="19" rx="34" ry="6" fill="url(#stahlWarm)" opacity="0.45"/>
  </g>

  <!-- ================= Eisennagel ================= -->
  <g transform="translate(238,440) rotate(19)">
    <g filter="url(#kontakt)">
      <path d="M-64,-9 L52,-4.5 L88,0 L52,4.5 L-64,9 Z" fill="url(#m2Eisen)"/>
      <ellipse cx="-68" cy="0" rx="10" ry="17" fill="url(#stahl)"/>
    </g>
    <path d="M-58,-5.4 L52,-2.2" stroke="#FFFFFF" stroke-width="2.6" fill="none" opacity="0.72"/>
    <ellipse cx="-70" cy="-6" rx="5" ry="6" fill="url(#glanz)"/>
    <ellipse cx="-66" cy="11" rx="7" ry="4" fill="url(#stahlWarm)" opacity="0.6"/>
    <ellipse cx="6" cy="7.4" rx="40" ry="3.4" fill="url(#stahlWarm)" opacity="0.5"/>
  </g>

  <!-- ================= Kupferdraht ================= -->
  <g transform="translate(566,462) rotate(3)">
    <g filter="url(#kontakt)">
      <path d="M-100,14 L-56,-8 Q-44,-14 -36,-4 L-14,22 Q-6,31 6,27 L52,10 Q66,5 72,-6 L86,-30"
            fill="none" stroke="url(#m2Kupfer)" stroke-width="9.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M-98,11 L-56,-11 Q-45,-17 -37,-7 L-16,19 Q-7,28 5,24 L51,7 Q64,2 70,-9 L84,-32"
          fill="none" stroke="#FFD9A8" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>
  </g>

  <!-- ================= Aludose (liegend) ================= -->
  <g transform="translate(752,412) rotate(-19)">
    <g filter="url(#weich)">
      <path d="M-74,-33 L62,-33 A13,33 0 0 1 62,33 L-74,33 A11,33 0 0 1 -74,-33 Z" fill="url(#m2Dose)"/>
    </g>
    <ellipse cx="62" cy="0" rx="13" ry="33" fill="url(#m2DoseEnd)"/>
    <ellipse cx="62" cy="0" rx="9" ry="25" fill="none" stroke="#5F6875" stroke-width="2" opacity="0.6"/>
    <path d="M50,-31 A13,31 0 0 0 50,31" fill="none" stroke="#EFF4F9" stroke-width="2.4" opacity="0.55"/>
    <path d="M-58,-31 A11,31 0 0 0 -58,31" fill="none" stroke="#5F6875" stroke-width="2.2" opacity="0.4"/>
    <rect x="-74" y="-26" width="132" height="13" rx="6" fill="url(#glanz)" opacity="0.85"/>
    <rect x="-70" y="20" width="124" height="11" rx="5" fill="url(#stahlWarm)" opacity="0.65"/>
    <path d="M-74,-33 L62,-33" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- ===== Vignette ===== -->
  <rect width="900" height="540" fill="url(#m2Vignette)"/>
</g>
<rect x="6" y="6" width="888" height="528" rx="78" fill="none" stroke="#C4963A" stroke-width="4.8"/>
</svg>
