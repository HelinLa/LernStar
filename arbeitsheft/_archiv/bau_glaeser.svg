  <ellipse cx="10" cy="3" rx="18" ry="5" fill="#FFEFB6" opacity="0.9" filter="url(#scheinKlein)"/>
  <path d="M -40,-158 L -34,-8 A 34,8 0 0 0 34,-8 L 40,-158 A 40,10 0 0 0 -40,-158 Z" fill="#E4EFF0" opacity="0.34"/>
  <path d="M -35.0,-32 L -33,-11 A 33,7 0 0 0 33,-11 L 35.0,-32 A 35.0,7.5 0 0 0 -35.0,-32 Z" fill="#A9CFD4" opacity="0.55"/>
