<!-- ============================================================
     bau_glaeser.svg | Fuenf gleiche Glaeser mit steigendem Wasserstand.
     Aus t_glas_halb abgeleitet, damit die Reihe wirklich identische Glaeser zeigt
     und sich nur das Wasser unterscheidet.
     ============================================================ -->
<!-- t_glas_1 | Trinkglas, Wasserstand 16% | 110 x 165 | Anker: Standflaeche Mitte -->
