  <ellipse cx="0" cy="-32" rx="35.0" ry="7.5" fill="#C2DFE0"/>
  <ellipse cx="0" cy="-32" rx="35.0" ry="7.5" fill="none" stroke="#6E969C" stroke-width="2" stroke-opacity="0.55"/>
  <path d="M -32.0,-32 A 34.0,6.5 0 0 1 32.0,-32" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-opacity="0.85"/>
  <path d="M -40,-158 L -34,-8 A 34,8 0 0 0 34,-8 L 40,-158 A 40,10 0 0 0 -40,-158 Z" fill="url(#glasK)"/>
  <ellipse cx="0" cy="-15" rx="33" ry="9" fill="#FFFFFF" opacity="0.34"/>
  <ellipse cx="0" cy="-11" rx="29" ry="6" fill="#A9C6CB" opacity="0.45"/>
  <path d="M -39.6,-152 L -33.8,-14" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M 39.4,-152 L 33.6,-14" fill="none" stroke="#4F757C" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
  <ellipse cx="-24" cy="-92" rx="7" ry="48" fill="url(#glanz)"/>
  <ellipse cx="0" cy="-158" rx="40" ry="10" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-opacity="0.85"/>
  <ellipse cx="0" cy="-157" rx="35.6" ry="8.6" fill="none" stroke="#6F9298" stroke-width="1.9" stroke-opacity="0.45"/>
</g>

