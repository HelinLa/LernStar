<!-- ============================================================
     bau_wolf.svg | Die Pappfigur aus dem Licht-Kapitel.
     t_wolf_form ist die nackte Silhouette OHNE fill - damit die Szene sie
     als Schatten einfaerben kann:  <use href="#t_wolf_form" fill="#2A1C08"/>
     t_pappfigur ist dieselbe Form als brauner Karton.
     Beide: nominal 130 x 150 | Anker: unten Mitte (dort steckt der Stab)
     ============================================================ -->
<linearGradient id="b_schnittkante" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#E0BC8C"/><stop offset="1" stop-color="#B98F5C"/>
</linearGradient>

<g id="t_wolf_form">
  <path d="M -44,0
           C -52,-30 -54,-58 -50,-74
           L -42,-98 L -28,-142 L -17,-104
           L -6,-112 L 4,-148 L 17,-105
           C 30,-99 42,-92 52,-85
           C 62,-80 72,-74 79,-67
           C 82,-63 80,-59 74,-58
           L 58,-57 C 46,-55 38,-52 32,-47
           C 24,-38 16,-27 10,-16
           C 6,-9 4,-4 3,0 Z"/>
</g>

<g id="t_pappfigur">
  <g filter="url(#kontakt)">
    <use href="#t_wolf_form" fill="url(#pappe)"/>
  </g>
  <g filter="url(#rauh)"><use href="#t_wolf_form" fill="url(#pappe)"/></g>
  <!-- heller Kartonrand an der Schnittkante -->
  <use href="#t_wolf_form" fill="none" stroke="url(#b_schnittkante)" stroke-width="3.4"/>
  <!-- angedeutete Wellpappe-Struktur, sehr zurueckhaltend -->
  <g opacity="0.16" stroke="#6E4C24" stroke-width="1.6">
    <path d="M-34,-24 L-30,-70"/><path d="M-16,-20 L-12,-78"/>
    <path d="M2,-18 L6,-90"/><path d="M20,-24 L26,-84"/>
  </g>
  <!-- das Auge ist ein ausgeschnittenes Loch, kein gemalter Punkt -->
  <ellipse cx="34" cy="-74" rx="6.5" ry="5" fill="#3A2711" opacity="0.7"/>
  <ellipse cx="34" cy="-75.5" rx="4.5" ry="3" fill="#241704" opacity="0.6"/>
</g>
